name: Feature request
description: A scene type, voice option, topic area or workflow you would like
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to make?
      description: The reel or workflow you cannot make today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: false
