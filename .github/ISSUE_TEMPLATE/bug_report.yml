name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command, and the spec file if it is short (remove anything private).
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `python3 engine/topic2reel.py --doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows (Git Bash), Windows (WSL), Other]
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it fail?
      options: [Spec validation, Preview or render, Voiceover (Piper), Music or mix, Claude Code plugin, Demo page, Other]
    validations:
      required: true
